[package]
name = "gravity-desktop"
version = "0.13.0"
description = "Gravity desktop client"
license = "MIT"
edition = "2021"

# Keep this crate out of the repository root Cargo workspace.
[workspace]

[lib]
name = "gravity_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "2", features = ["json"] }
toml = "0.8"

# On-device dictation for the chat composer (Apple's Speech framework).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-speech = "0.3"
objc2-avf-audio = "0.3"

# On-device dictation on Windows (SAPI's in-process recognizer).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }
